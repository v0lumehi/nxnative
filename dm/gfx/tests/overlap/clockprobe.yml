# xcodegen spec of the clock probe app (its own bundle ID); dm/gfx/tests/overlap/build_clockprobe.sh generates and builds it outside the repository
name: ClockProbe
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  ClockProbe:
    type: application
    platform: iOS
    sources: [clockprobe.m, overlap.m]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zijadaljic.clockprobe
        DEVELOPMENT_TEAM: E75GJAP35S
        CODE_SIGN_STYLE: Automatic
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
